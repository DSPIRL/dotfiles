[time]
disabled = false

[cmd_duration]
disabled = false
show_milliseconds = true
min_time = 0

[shlvl]
disabled = false

##### BEGIN - GIT #####
[git_metrics]
added_style = 'bold blue'
format = '[+$added]($added_style)/[-$deleted]($deleted_style) '

[git_commit]
disabled = false

[git_branch]
symbol = " "

[fossil_branch]
symbol = " "

[hg_branch]
symbol = " "
##### END - GIT #####

##### BEGIN - NETWORK #####
[hostname]
ssh_symbol = " "
##### END - NETWORK #####

##### BEGIN - SYSTEM INFO #####
[memory_usage]
symbol = "󰍛 "
##### END - SYSTEM INFO #####

##### BEGIN - DIRECTORY #####
[directory]
read_only = " 󰌾"
##### END - DIRECTORY #####


[aws]
symbol = "  "

