[metadata]
name = "docker-images"
description = "Select images from Podman or Docker"
requirements = ["jq"]

[source]
command = '"${HOME}/.local/scripts/container-engine" images --format "{{.Repository}}:{{.Tag}} {{.ID}}"'
output = "{split: :-1}"

[preview]
command = '"${HOME}/.local/scripts/container-engine" image inspect "{split: :-1}" | jq -C'

[ui]
layout = "portrait"

[keybindings]
ctrl-r = "actions:run"
ctrl-d = "actions:remove"
ctrl-s = "actions:shell"

[actions.run]
description = "Run a container from the selected image"
command = '"${HOME}/.local/scripts/container-engine" run -it "{split: :-1}"'
mode = "execute"

[actions.shell]
description = "Run a shell in the selected image"
command = '"${HOME}/.local/scripts/container-engine" run -it "{split: :-1}" /bin/sh'
mode = "execute"

[actions.remove]
description = "Remove the selected image"
command = '"${HOME}/.local/scripts/container-engine" rmi "{split: :-1}"'
mode = "execute"
