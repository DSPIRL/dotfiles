###################
### MY PROGRAMS ###
###################
# See https://wiki.hyprland.org/Configuring/Keywords/

##### KEYS #####
$mainMod = SUPER # Sets "Windows" key as main modifier

##### PROGRAMS #####
# Set programs that you use
$terminal = ${USER_TERMINAL:-${ALT_TERMINAL:}}
$editor = ${EDITOR:-vi}
# $emacs = emacs
$fileManager = dolphin
$browser = zen_browser
$searchEngine = "https://kagi.com/search?q={}"
$emojiPicker = "$HYPR_SCRIPTS/emoji-picker.sh"
$notifications = qs ipc call notifications toggle
$controlPanel = qs ipc call control toggle
$barReload = "$HYPR_SCRIPTS/quickshell-reload.sh"
$barDoctor = "$HYPR_SCRIPTS/quickshell-healthcheck.sh"
$opacityToggle = "$HYPR_SCRIPTS/toggle-opacity.sh"
$themeToggle = "$HYPR_SCRIPTS/toggle-breeze-theme.sh"

# $screenshotRegion = grim -g "$(slurp -d)" - | wl-copy
# $screenshotRegion = hyprshot -m region --clipboard-only

$screenshotWindow = hyprshot -m window -o /tmp/hyprshot -f latest.png
$screenshotRegion = hyprshot -m region -o /tmp/hyprshot -f latest.png
$editLastScreenshot = spectacle --edit-existing /tmp/hyprshot/latest.png

$music = "$HYPR_SCRIPTS/ncspot.sh"
$wallpaperGui = "$HYPR_SCRIPTS/waypaper.sh"
$telegram = telegram
$discord = discord

##### Idle Handler #####
$idleHandler = swayidle -w timeout 300 'swaylock -f -c 000000' before-sleep 'swaylock -f -c 000000'

##### Locker #####
$locker = hyprlock

##### ROFI #####
$appLauncher= "$HYPR_SCRIPTS/rofi-drun.sh"
$clipboard = "$HYPR_SCRIPTS/rofi-clipboard.sh"
$shell = "$HYPR_SCRIPTS/rofi-shell.sh"
$search = "$HYPR_SCRIPTS/rofi-search.sh"
