##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

###### CachyOS ######
windowrule = float on, match:class ^(CachyOSHello)$
windowrule = float on, match:class ^(zenity)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_initial_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false


### TAGGING ###
# windowrule - tags - add apps under appropriate tag to use the same settings
# browser tags
windowrule = tag +browser, match:class ^([Ff]irefox|org.mozilla.firefox|[Ff]irefox-esr|[Ff]irefox-bin)$
windowrule = tag +browser, match:class ^([Zz]en|[Zz]en-[Bb]rowser|app.zen_browser.zen)$
windowrule = tag +browser, match:class ^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$
windowrule = tag +browser, match:class ^(chrome-.+-Default)$ # Chrome PWAs
windowrule = tag +browser, match:class ^([Cc]hromium)$
windowrule = tag +browser, match:class ^([Vv]ivaldi|com.vivaldi.Vivaldi)$
windowrule = tag +browser, match:class ^([Mm]icrosoft-edge(-stable|-beta|-dev|-unstable))$
windowrule = tag +browser, match:class ^([Bb]rave-browser(-beta|-dev|-unstable)?)$
windowrule = tag +browser, match:class ^([Tt]horium-browser|[Cc]achy-browser)$
windowrule = tag +browser, match:class ^(zen-alpha|zen)$

# notification tags
# windowrule = tag +notif, match:class ^(swaync-control-center|swaync-notification-window|swaync-client|class)$

# terminal tags
windowrule = tag +terminal, match:class ^([Aa]lacritty|kitty|kitty-dropterm|[Ww]ezterm|[Ww]ezterm-gui|org.wezfurlong.wezterm|[Gg]hostty|com.mitchellh.ghostty)$

# Dictionary
windowrule = tag +dictionary, match:class ^(gnome-dictionary|org.gnome.[Dd]ictionary)$

# Emoji
windowrule = tag +emoji, match:class ^(smile|it.mijorus.smile|gnome-characters|org.gnome.Characters)$

# project tags
windowrule = tag +projects, match:class ^(codium|codium-url-handler|VSCodium)$
windowrule = tag +projects, match:class ^(VSCode|code-url-handler)$
windowrule = tag +projects, match:class ^(jetbrains-.+|rustrover.+|webstorm.+|clion.+|pycharm.+|rider.+)$ # JetBrains IDEs

# Editor Tags
windowrule = tag +editors, match:class ^(nvim)

# screenshare tags
windowrule = tag +screenshare, match:class ^(com.obsproject.Studio)$

# IM tags
windowrule = tag +im, match:class ^([Dd]iscord|[Ww]ebCord|[Vv]esktop|com.discordapp.Discord)$
windowrule = tag +im, match:class ^([Ff]erdium)$
windowrule = tag +im, match:class ^([Ww]hatsapp-for-linux)$
windowrule = tag +im, match:class ^(ZapZap|com.rtosta.zapzap)$
windowrule = tag +im, match:class ^(org.telegram.desktop|io.github.tdesktop_x64.TDesktop|[Tt]elegram)$
windowrule = tag +im, match:class ^(teams-for-linux)$

# game tags
windowrule = tag +games, match:class ^(gamescope)$
windowrule = tag +games, match:class ^(steam_app_\d+)$

# gamestore tags
windowrule = tag +gamestore, match:class ^([Ss]team)$
windowrule = tag +gamestore, match:title ^([Ll]utris)$
windowrule = tag +gamestore, match:class ^(com.heroicgameslauncher.hgl)$

# file-manager tags
windowrule = tag +file-manager, match:class ^([Tt]hunar|org.gnome.Nautilus|[Pp]cmanfm-qt|[Nn]autilus|[Dd]olphin)$
windowrule = tag +file-manager, match:class ^(app.drey.Warp)$

# wallpaper tags
windowrule = tag +wallpaper, match:class ^([Ww]aytrogen)$
windowrule = tag +wallpaper, match:class ^([Ww]aypaper)$

# multimedia tags
windowrule = tag +multimedia, match:class ^([Aa]udacious)$

# multimedia-video tags
windowrule = tag +multimedia_video, match:class ^([Mm]pv|vlc)$

# VPN tags
windowrule = tag +vpns, match:class ^(protonvpn-app)$

# Keychains
windowrule = tag +keychains, match:class ^(keepassxc|org.keepassxc.KeePassXC)$

# Emacs
windowrule = tag +emacs, match:class ^([Ee]macs)$


# settings tags
windowrule = tag +settings, match:class ^([Gg]ddccontrol)$ # DDC Control
windowrule = tag +settings, match:title ^(ROG Control)$
windowrule = tag +settings, match:class ^(wihotspot(-gui)?)$ # wifi hotspot
windowrule = tag +settings, match:class ^([Bb]aobab|org.gnome.[Bb]aobab)$ # Disk usage analyzer
windowrule = tag +settings, match:class ^(gnome-disks|wihotspot(-gui)?)$
windowrule = tag +settings, match:title (Kvantum Manager)
windowrule = tag +settings, match:class ^(file-roller|org.gnome.FileRoller)$ # archive manager
windowrule = tag +settings, match:class ^(nm-applet|nm-connection-editor|blueman-manager)$
windowrule = tag +settings, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule = tag +settings, match:class ^(qt5ct|qt6ct|[Yy]ad)$
windowrule = tag +settings, match:class (xdg-desktop-portal-gtk)
windowrule = tag +settings, match:class ^(org.kde.polkit-kde-authentication-agent-1|polkit-gnome-authentication-agent-1|hyprpolkitagent|org.org.polkit-kde-authentication-agent-1)(.*)$
windowrule = tag +settings, match:class ^([Rr]ofi)$

# viewer tags
windowrule = tag +viewer, match:class ^(gnome-system-monitor|org.gnome.SystemMonitor|io.missioncenter.MissionCenter)$ # system monitor
windowrule = tag +viewer, match:class ^(evince)$ # document viewer
windowrule = tag +viewer, match:class ^(eog|org.gnome.Loupe)$ # image viewer

# Some special override rules
windowrule = no_blur on, match:tag multimedia_video
windowrule = opacity 1.0, match:tag multimedia_video

# POSITION
# windowrule = center,floating:1 # warning, it cause even the menu to float and center.
windowrule = center on, match:class ([Tt]hunar), match:title negative:(.*[Tt]hunar.*)
windowrule = center on, match:title ^(ROG Control)$
windowrule = center on, match:title ^(Keybindings)$
windowrule = center on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$
windowrule = center on, match:class ^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$
windowrule = center on, match:class ^([Ff]erdium)$
windowrule = move (monitor_w*0.72) (monitor_h*0.07), match:title ^(Picture-in-Picture)$
# windowrule to avoid idle for fullscreen apps
windowrule = idle_inhibit fullscreen, match:fullscreen true

# windowrule move to workspace
windowrule = workspace 1, match:tag im
# windowrule = workspace 4, match:tag emacs
windowrule = workspace 5, match:tag browser
windowrule = workspace 10, match:tag games

# windowrule move to workspace (silent)
# windowrule = workspace 4 silent, match:tag screenshare
# windowrule = workspace 6 silent, match:class ^(virt-manager)$
# windowrule = workspace 6 silent, match:class ^(.virt-manager-wrapped)$
# windowrule = workspace 9 silent, match:tag multimedia


##### TAG RULES #####
# Terminals
windowrule = float on, match:tag terminal
windowrule = size (monitor_w*0.8) (monitor_h*0.8), match:tag terminal
windowrule = opacity 0.9 0.75 1.0, match:tag terminal

# Emacs
windowrule = opacity 1.0 0.75, match:tag emacs

# Messengers
windowrule = float on, match:tag im
windowrule = size (monitor_w*0.6) (monitor_h*0.6), match:tag im
windowrule = opacity 0.94 0.86, match:tag im

# VPN
windowrule = float on, match:tag vpns
windowrule = size (monitor_w*0.1) (monitor_h*0.1), match:tag vpns
windowrule = center on, match:tag vpns

# Keychains
windowrule = float on, match:tag keychains
windowrule = size (monitor_w*0.5) (monitor_h*0.5), match:tag keychains
windowrule = center on, match:tag keychains

# Wallpaper GUI
windowrule = float on, match:tag wallpaper
windowrule = size (monitor_w*0.7) (monitor_h*0.8), match:tag wallpaper
windowrule = opacity 0.9 0.7, match:tag wallpaper

# Dictionary
windowrule = float on, match:tag dictionary
windowrule = size (monitor_w*0.1) (monitor_h*0.1), match:tag dictionary
windowrule = center on, match:tag dictionary

# Emoji
windowrule = float on, match:tag emoji
windowrule = size (monitor_w*0.1) (monitor_h*0.1), match:tag emoji
windowrule = center on, match:tag emoji

# Settings
windowrule = float on, match:tag settings
windowrule = size (monitor_w*0.7) (monitor_h*0.7), match:tag settings
windowrule = opacity 0.8 0.7, match:tag settings

# File Managers
windowrule = float on, match:tag file-manager
windowrule = size (monitor_w*0.7) (monitor_h*0.7), match:tag file-manager
windowrule = opacity 0.9 0.8, match:tag file-manager

# Browser
windowrule = opacity 1.0 1.0, match:tag browser


# FLOATING RULES
windowrule = float on, match:tag viewer
windowrule = float on, match:class ([Zz]oom|onedriver|onedriver-launcher)$
windowrule = float on, match:class (org.gnome.Calculator), match:title (Calculator)
windowrule = float on, match:class ^(mpv|com.github.rafostar.Clapper)$
windowrule = float on, match:class ^([Qq]alculate-gtk)$
windowrule = float on, match:class ^([Ff]erdium)$
windowrule = float on, match:title ^(Picture-in-Picture)$

# windowrule - ######### float popups and dialogue #######
windowrule = float on, match:title ^(Authentication Required)$
windowrule = center on, match:title ^(Authentication Required)$
windowrule = float on, match:class (codium|codium-url-handler|VSCodium), match:title negative:(.*codium.*|.*VSCodium.*)
windowrule = float on, match:class ^(com.heroicgameslauncher.hgl)$, match:title negative:(Heroic Games Launcher)
windowrule = float on, match:class ^([Ss]team)$, match:title negative:^([Ss]team)$
windowrule = float on, match:class ([Tt]hunar), match:title negative:(.*[Tt]hunar.*)

windowrule = float on, match:title ^(Add Folder to Workspace)$
windowrule = size (monitor_w*0.7) (monitor_h*0.6), match:title ^(Add Folder to Workspace)$
windowrule = center on, match:title ^(Add Folder to Workspace)$

windowrule = float on, match:title ^(Save As)$
windowrule = size (monitor_w*0.7) (monitor_h*0.6), match:title ^(Save As)$
windowrule = center on, match:title ^(Save As)$
windowrule = float on, match:class ^()$, match:title ^(Save File)$
windowrule = float on, match:class ^()$, match:title ^(Open File)$

windowrule = float on, match:initial_title (Open Files)
windowrule = size (monitor_w*0.7) (monitor_h*0.6), match:initial_title (Open Files)

windowrule = float on, match:title ^(SDDM Background)$
windowrule = center on, match:title ^(SDDM Background)$
windowrule = size (monitor_w*0.16) (monitor_h*0.12), match:title ^(SDDM Background)$
# END of float popups and dialogue #######

# OPACITY
windowrule = opacity 1.0 0.95 1.0, match:tag projects
windowrule = opacity 0.94 0.86, match:tag multimedia
windowrule = opacity 0.82 0.75, match:tag viewer
windowrule = opacity 0.8 0.7, match:class ^(gedit|org.gnome.TextEditor|mousepad)$
windowrule = opacity 0.9 0.8, match:class ^(deluge)$
windowrule = opacity 0.9 0.8, match:class ^(im.riot.Riot)$ # Element matrix client
windowrule = opacity 0.9 0.8, match:class ^(seahorse)$ # gnome-keyring gui
windowrule = opacity 0.95 0.75, match:title ^(Picture-in-Picture)$

# Runtime override used by ~/.config/hypr/scripts/toggle-opacity.sh.
source = ~/.config/hypr/config/opacity-toggle.conf

# SIZE
windowrule = size (monitor_w*0.6) (monitor_h*0.7), match:class ^([Ww]hatsapp-for-linux|ZapZap|com.rtosta.zapzap)$
windowrule = size (monitor_w*0.6) (monitor_h*0.7), match:class ^([Ff]erdium)$

# PINNING
windowrule = pin on, match:title ^(Picture-in-Picture)$

# windowrule - extras
windowrule = keep_aspect_ratio on, match:title ^(Picture-in-Picture)$

# BLUR & FULLSCREEN
windowrule = no_blur on, match:tag games
windowrule = fullscreen on, match:tag games

# LAYER RULES
layerrule = blur on, match:namespace quickshell
layerrule = ignore_alpha 0, match:namespace quickshell
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0, match:namespace rofi
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0, match:namespace notifications
