#####################
### LOOK AND FEEL ###
#####################
source = ~/.config/hypr/themes/wallust.conf

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
  border_size = 3
  gaps_in = 4
  gaps_out = 5

  col.active_border = $color12 $color11 $color9 $color7 45deg
  col.inactive_border = rgba(00ffff00)
  resize_on_border = true
}


# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
  rounding = 12
         
  active_opacity = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0

  # dim_inactive = true
  dim_strength = 0.1
  dim_special = 0.8

    shadow {
        enabled = true
        range = 2
        render_power = 1

        color =  $color12
        color_inactive = $color10
    }


    blur {
        enabled = true
        size = 4
        passes = 3

        xray = true

        # vibrancy = 0.1696
        ignore_opacity = true
        vibrancy = 0
        popups = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations

animations {
  enabled = yes

  bezier = wind, 0.05, 0.9, 0.1, 1.05
  bezier = winIn, 0.1, 1.1, 0.1, 1.1
  bezier = winOut, 0.3, -0.3, 0, 1
  bezier = liner, 1, 1, 1, 1
  bezier = overshot, 0.05, 0.9, 0.1, 1.05
  bezier = smoothOut, 0.5, 0, 0.99, 0.99
  bezier = smoothIn, 0.5, -0.5, 0.68, 1.5
  
  animation = windows, 1, 6, wind, slide
  animation = windowsIn, 1, 5, winIn, slide
  animation = windowsOut, 1, 3, smoothOut, slide
  animation = windowsMove, 1, 5, wind, slide
  animation = border, 1, 1, liner
  animation = borderangle, 1, 55, liner, loop #used by rainbow borders and rotating colors
  animation = fade, 1, 3, smoothOut
  animation = workspaces, 1, 5, overshot
  
  # animations for -git or version >0.42.0
  animation = workspacesIn, 1, 5, winIn, slide
  animation = workspacesOut, 1, 5, winOut, slide
}


# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# I changed this to just add a nice border around windows instead of them going all the way to the edge - Raphi
workspace = w[t1], gapsout:1, gapsin:0
workspace = w[tg1], gapsout:1, gapsin:0
workspace = f[1], gapsout:1, gapsin:1
windowrule = border_size 3, match:float false, match:workspace w[t1]
windowrule = rounding 12, match:float true, match:workspace w[t1]
windowrule = border_size 0, match:float false, match:workspace w[tg1]
windowrule = rounding 0, match:float false, match:workspace w[tg1]
windowrule = border_size 0, match:float false, match:workspace f[1]
windowrule = rounding 0, match:float false, match:workspace f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    font_family = "Fira Sans"
    focus_on_activate = true
    vrr = 2
}

group {
  col.border_active = $color15

	groupbar {
		col.active = $color0
  }
}
